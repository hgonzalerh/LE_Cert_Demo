---
# Shared settings for test_infra_create.yml / test_infra_delete.yml.
# Override any of these with -e.

# DigitalOcean API token. Read from the gitignored .do_api_token file.
do_api_token: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/.do_api_token') }}"
do_api: "https://api.digitalocean.com/v2"

# Subdomain delegated to DigitalOcean DNS (NS records at the registrar:
# test -> ns1/ns2/ns3.digitalocean.com).
do_dns_zone: "test.hugonz.lat"
do_dns_ttl: 60

# Short names; each droplet is named and resolved as <name>.<do_dns_zone>.
do_test_hosts:
  - web02
  - web03

# Only droplets carrying this tag are ever touched by the delete playbook.
do_tag: "le-cert-demo"

do_region: "sfo3"
do_size: "s-1vcpu-1gb"
do_image: "rockylinux-9-x64"

# SSH key already uploaded to DigitalOcean (fingerprint) and its local pair.
do_ssh_key_fingerprint: "6e:72:40:b3:85:a9:19:22:94:a6:9a:9f:cd:63:58:ee"
do_ssh_private_key_file: "~/.ssh/glorfindel"
do_ssh_public_key_file: "~/.ssh/glorfindel.pub"

# User created by cloud-init, matching the real inventory's ansible_user.
do_remote_user: "cloud-user"

# Generated inventory for the test droplets (gitignored).
do_inventory_file: "{{ playbook_dir }}/test_infra_hosts"
