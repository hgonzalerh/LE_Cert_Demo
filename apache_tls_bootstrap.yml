---
# apache_tls_bootstrap.yml
#
# Bootstrap a TLS endpoint on each host:
#   - Prepare the server software as a TLS endpoint (packages, vhost, firewall).
#   - If there is no cert at all yet, install a short-lived self-signed one at
#     the same paths tls_renew.yml writes to, so a later ACME run is a drop-in
#     replacement.
#
# The server software is chosen with `cert_target` (default: apache), which
# selects the role cert_target_<cert_target>.
#
# Idempotency: an existing cert is left alone. tls_renew.yml handles
# "the cert is bad" — this playbook only handles "there is no cert at all".

- name: "Bootstrap TLS endpoint with self-signed cert"
  hosts: webservers
  become: true
  gather_facts: true

  vars:
    cert_target_role: "cert_target_{{ cert_target | default('apache') }}"

  tasks:
    - name: "Prepare the TLS endpoint"
      ansible.builtin.include_role:
        name: "{{ cert_target_role }}"
        tasks_from: prepare

    - name: "Install a self-signed cert when none is present"
      when: not cert_target_has_cert | bool
      block:
        - name: "Generate self-signed cert on the controller"
          ansible.builtin.include_role:
            name: selfsigned_cert

        - name: "Install the self-signed cert"
          ansible.builtin.include_role:
            name: "{{ cert_target_role }}"
            tasks_from: install

    - name: "Verify the TLS endpoint"
      ansible.builtin.include_role:
        name: "{{ cert_target_role }}"
        tasks_from: verify
