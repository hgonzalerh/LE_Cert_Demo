---
# tls_renew.yml
#
# Play 1: Check each inventory host's live TLS endpoint. Mark any host whose
#         certificate is missing, expired, expiring soon, or whose chain does
#         not validate against the public trust store as non-compliant.
#
# Play 2: For non-compliant hosts only, obtain a new cert from Let's Encrypt
#         via HTTP-01 and install it on the host.
#
# The server software is chosen with `cert_target` (default: apache), which
# selects the role cert_target_<cert_target>. That role publishes the
# challenge and installs the cert; everything else is target-agnostic.
#
# Assumptions:
#   - Inventory hostnames ARE the FQDNs the cert must cover.
#   - The target serves http://<fqdn>/.well-known/acme-challenge/ on :80.
#   - SSH + become to root are available.
#   - community.crypto is installed on the control node.

- name: "Play 1 — Audit TLS certificates on every host"
  hosts: webservers
  gather_facts: false
  roles:
    - tls_audit
  # Output: tls_compliant (per host)


- name: "Play 2 — Renew certificates for non-compliant hosts via ACME"
  hosts: webservers
  gather_facts: true

  vars:
    cert_target_role: "cert_target_{{ cert_target | default('apache') }}"

  tasks:
    - name: "Skip compliant hosts"
      ansible.builtin.meta: end_host
      when: tls_compliant | bool

    - name: "ACME — order the certificate"
      ansible.builtin.include_role:
        name: acme_cert
      # Output: cert_challenge

    - name: "Answer the http-01 challenge and retrieve the cert"
      block:
        - name: "Publish the challenge on the target"
          ansible.builtin.include_role:
            name: "{{ cert_target_role }}"
            tasks_from: publish_challenge

        - name: "ACME — validate and retrieve the certificate"
          ansible.builtin.include_role:
            name: acme_cert
            tasks_from: finalize
          # Output: cert_files
      always:
        - name: "Remove the challenge from the target"
          ansible.builtin.include_role:
            name: "{{ cert_target_role }}"
            tasks_from: cleanup_challenge

    - name: "Install the certificate on the target"
      ansible.builtin.include_role:
        name: "{{ cert_target_role }}"
        tasks_from: install

    - name: "Verify the target"
      ansible.builtin.include_role:
        name: "{{ cert_target_role }}"
        tasks_from: verify
